<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>NECTAR · Меню</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="menu-wrapper">
        <!-- Шапка -->
        <header class="header">
            <div class="header-top">
                <span class="brand">NECTAR</span>
                <span class="brand-sub">LOUNGE · BAR · KITCHEN</span>
            </div>
            <div class="divider"></div>
            <div class="header-bottom">
                <span class="city">Алматы</span>
                <span class="year">2026</span>
            </div>
        </header>

        <!-- Секции меню -->
        <main class="menu-content" id="menuContent">
            <!-- Категории будут вставлены JS -->
        </main>

        <!-- Футер с контактами -->
        <footer class="footer">
            <div class="divider"></div>
            <div class="contacts">
                <a href="tel:+77064273269" class="contact-link">📞 +7 706 427 32 69</a>
                <a href="https://go.2gis.com/C8OUZ" target="_blank" class="contact-link">📍 Мы на карте</a>
            </div>
        </footer>
    </div>

    <!-- Модалка для деталей блюда -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">✕</button>
            <h2 class="modal-title" id="modalTitle">Название</h2>
            <div class="modal-price" id="modalPrice">0 ₸</div>
            <div class="modal-detail">
                <span class="modal-label">Выход</span>
                <span class="modal-value" id="modalOutput">—</span>
            </div>
            <div class="modal-detail">
                <span class="modal-label">Состав</span>
                <span class="modal-value" id="modalComposition">—</span>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
