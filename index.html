<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ea">
<meta name="description" content="NECTAR — Lounge · Bar · Kitchen">
<title>NECTAR — Lounge · Bar · Kitchen</title>

<style>
/* =========================================================
   NECTAR
   Editorial restaurant menu
   No external libraries / fonts / CDN
   ========================================================= */

:root {
  --cream: #f7f3ea;
  --cream-light: #fbf9f3;
  --cream-deep: #eee8da;

  --green: #344a38;
  --green-soft: #49624b;

  --nectarine: #e58a52;
  --peach: #f2d2bc;

  --ink: #29312b;
  --muted: #858980;
  --line: rgba(52, 74, 56, .18);
  --line-strong: rgba(52, 74, 56, .32);

  --radius: 18px;

  --serif:
    Georgia,
    "Times New Roman",
    Times,
    serif;

  --sans:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  background: var(--cream);
}

body {
  margin: 0;
  min-width: 320px;
  background:
    radial-gradient(
      circle at 88% 7%,
      rgba(229, 138, 82, .075),
      transparent 22rem
    ),
    var(--cream);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button,
input {
  font: inherit;
}

button {
  border: 0;
}

a {
  color: inherit;
  text-decoration: none;
}

::selection {
  background: var(--peach);
  color: var(--green);
}

/* =========================================================
   APP
   ========================================================= */

.app {
  width: min(100%, 760px);
  margin: 0 auto;
  padding:
    max(28px, env(safe-area-inset-top))
    22px
    calc(36px + env(safe-area-inset-bottom));
}

/* =========================================================
   HEADER
   ========================================================= */

.site-header {
  position: relative;
  padding: 24px 0 34px;
}

.brand {
  position: relative;
  display: inline-block;
}

.brand-name {
  margin: 0;
  color: var(--green);
  font-family: var(--serif);
  font-size: clamp(3.2rem, 15vw, 6rem);
  font-weight: 400;
  letter-spacing: -.065em;
  line-height: .82;
}

.brand-subtitle {
  margin-top: 13px;
  color: var(--green-soft);
  font-family: var(--sans);
  font-size: .63rem;
  font-weight: 600;
  letter-spacing: .25em;
  line-height: 1.5;
  text-transform: uppercase;
}

/*
   Very light botanical line.
   It is intentionally not a "peach picture".
   It is a brand detail.
*/
.botanical {
  position: absolute;
  top: 4px;
  right: 2px;
  width: 88px;
  height: 104px;
  opacity: .78;
  pointer-events: none;
}

.botanical path,
.botanical ellipse {
  fill: none;
  stroke: var(--green-soft);
  stroke-width: 1.15;
  stroke-linecap: round;
}

.botanical .fruit {
  fill: rgba(229, 138, 82, .08);
  stroke: var(--nectarine);
}

.botanical .stem {
  stroke: var(--green);
}

.language-switcher {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 31px;
}

.language-button {
  min-width: 44px;
  min-height: 38px;
  padding: 8px 10px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .12em;
  transition:
    background .2s ease,
    color .2s ease,
    border-color .2s ease;
}

.language-button:hover,
.language-button:focus-visible {
  outline: none;
  color: var(--green);
  border-color: var(--line);
}

.language-button.active {
  background: var(--green);
  color: var(--cream);
}

/* =========================================================
   DECORATIVE RULE
   ========================================================= */

.editorial-rule {
  display: flex;
  align-items: center;
  gap: 13px;
  margin: 5px 0 37px;
  color: var(--muted);
  font-size: .58rem;
  font-weight: 700;
  letter-spacing: .24em;
  text-transform: uppercase;
}

.editorial-rule::before,
.editorial-rule::after {
  content: "";
  height: 1px;
  background: var(--line);
}

.editorial-rule::before {
  width: 20px;
}

.editorial-rule::after {
  flex: 1;
}

/* =========================================================
   SECTION HEADERS
   ========================================================= */

.menu-group {
  margin-bottom: 54px;
}

.section-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 15px;
}

.section-heading h2 {
  margin: 0;
  color: var(--green);
  font-family: var(--serif);
  font-size: 2rem;
  font-weight: 400;
  letter-spacing: -.035em;
}

.section-heading span {
  color: var(--muted);
  font-size: .58rem;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
}

/* =========================================================
   CATEGORY LIST
   ========================================================= */

.category-list {
  border-top: 1px solid var(--line-strong);
}

.category-item {
  position: relative;
  display: grid;
  grid-template-columns: 35px 1fr 24px;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 69px;
  padding: 12px 2px;
  border-bottom: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  transition:
    padding .2s ease,
    color .2s ease;
}

.category-item:hover,
.category-item:focus-visible {
  outline: none;
  padding-left: 7px;
  padding-right: 7px;
  color: var(--green);
}

.category-number {
  color: var(--muted);
  font-family: var(--sans);
  font-size: .65rem;
  font-weight: 700;
  letter-spacing: .08em;
}

.category-name {
  font-family: var(--serif);
  font-size: 1.22rem;
  font-weight: 400;
  letter-spacing: -.015em;
}

.category-arrow {
  color: var(--green-soft);
  font-size: 1rem;
  text-align: right;
}

/* =========================================================
   SUBCATEGORY PAGE
   ========================================================= */

.view {
  display: none;
}

.view.active {
  display: block;
}

.page-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin: 6px 0 30px;
}

.back-button {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 7px 0;
  background: transparent;
  color: var(--green);
  cursor: pointer;
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
}

.back-button:hover,
.back-button:focus-visible {
  outline: none;
  opacity: .7;
}

.page-number {
  color: var(--muted);
  font-size: .6rem;
  font-weight: 700;
  letter-spacing: .18em;
}

.page-title {
  margin: 0 0 28px;
  color: var(--green);
  font-family: var(--serif);
  font-size: clamp(2.3rem, 10vw, 4rem);
  font-weight: 400;
  letter-spacing: -.055em;
  line-height: .95;
}

/* =========================================================
   ITEMS
   ========================================================= */

.item-list {
  border-top: 1px solid var(--line-strong);
}

.menu-item {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 18px;
  width: 100%;
  min-height: 78px;
  padding: 18px 2px;
  border-bottom: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  transition:
    padding .2s ease,
    background .2s ease;
}

.menu-item:hover,
.menu-item:focus-visible {
  outline: none;
  padding-left: 7px;
  padding-right: 7px;
  background: rgba(255,255,255,.28);
}

.item-name {
  display: block;
  font-family: var(--serif);
  font-size: 1.08rem;
  font-weight: 400;
  line-height: 1.25;
}

.item-note {
  display: block;
  max-width: 470px;
  margin-top: 6px;
  color: var(--muted);
  font-size: .76rem;
  line-height: 1.45;
}

.item-price {
  align-self: start;
  padding-top: 2px;
  color: var(--green);
  font-size: .78rem;
  font-weight: 700;
  white-space: nowrap;
}

/* =========================================================
   SEARCH
   ========================================================= */

.search-trigger {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-height: 58px;
  margin: 7px 0 50px;
  padding: 0 2px;
  border-top: 1px solid var(--line-strong);
  border-bottom: 1px solid var(--line);
  background: transparent;
  color: var(--green);
  cursor: pointer;
  text-align: left;
}

.search-trigger span:first-child {
  font-size: .69rem;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
}

.search-icon {
  font-size: 1.1rem;
}

/* =========================================================
   FOOTER
   ========================================================= */

.footer {
  margin-top: 65px;
  padding-top: 31px;
  border-top: 1px solid var(--line-strong);
}

.footer-section {
  margin-bottom: 40px;
}

.footer-title {
  margin: 0 0 17px;
  color: var(--green);
  font-family: var(--serif);
  font-size: 1.5rem;
  font-weight: 400;
}

.footer-links {
  display: grid;
  border-top: 1px solid var(--line);
}

.footer-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 54px;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
  font-size: .8rem;
}

.footer-link span:last-child {
  color: var(--muted);
}

.contact-actions {
  display: grid;
  gap: 9px;
}

.contact-button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 54px;
  padding: 0 16px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  color: var(--green);
  background: rgba(255,255,255,.18);
  font-size: .74rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  transition:
    background .2s ease,
    color .2s ease,
    transform .2s ease;
}

.contact-button:hover,
.contact-button:focus-visible {
  outline: none;
  background: var(--green);
  color: var(--cream);
}

.footer-brand {
  margin-top: 52px;
  color: var(--green);
  font-family: var(--serif);
  font-size: 2.8rem;
  font-weight: 400;
  letter-spacing: -.06em;
}

.footer-small {
  margin-top: 8px;
  color: var(--muted);
  font-size: .58rem;
  letter-spacing: .2em;
  text-transform: uppercase;
}

/* =========================================================
   MODAL / BOTTOM SHEET
   ========================================================= */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 0;
  background: rgba(31, 40, 33, .26);
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease;
}

.overlay.open {
  opacity: 1;
  pointer-events: auto;
}

.sheet {
  width: min(100%, 760px);
  max-height: min(88vh, 760px);
  overflow-y: auto;
  padding:
    11px 22px
    calc(28px + env(safe-area-inset-bottom));
  border-radius: 24px 24px 0 0;
  background: var(--cream-light);
  box-shadow: 0 -20px 60px rgba(40,50,42,.13);
  transform: translateY(100%);
  transition: transform .32s cubic-bezier(.22,.8,.25,1);
}

.overlay.open .sheet {
  transform: translateY(0);
}

.sheet-handle {
  width: 42px;
  height: 3px;
  margin: 0 auto 18px;
  border-radius: 999px;
  background: var(--line-strong);
}

.sheet-close-row {
  display: flex;
  justify-content: flex-end;
}

.close-button {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: transparent;
  color: var(--green);
  cursor: pointer;
  font-size: 1.2rem;
}

.close-button:hover,
.close-button:focus-visible {
  outline: none;
  background: var(--cream-deep);
}

.sheet-photo {
  display: none;
  width: 100%;
  max-height: 360px;
  margin: 3px 0 25px;
  border-radius: 15px;
  object-fit: cover;
  aspect-ratio: 4 / 3;
}

.sheet.has-photo .sheet-photo {
  display: block;
}

.sheet-category {
  margin-top: 10px;
  color: var(--muted);
  font-size: .58rem;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
}

.sheet-title {
  margin: 8px 0 7px;
  color: var(--green);
  font-family: var(--serif);
  font-size: clamp(2rem, 9vw, 3.3rem);
  font-weight: 400;
  letter-spacing: -.05em;
  line-height: .98;
}

.sheet-price {
  color: var(--nectarine);
  font-size: 1rem;
  font-weight: 700;
}

.sheet-info {
  display: grid;
  grid-template-columns: 1fr;
  gap: 22px;
  margin-top: 34px;
}

.info-block {
  padding-top: 17px;
  border-top: 1px solid var(--line);
}

.info-label {
  color: var(--muted);
  font-size: .57rem;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
}

.info-value {
  margin-top: 8px;
  color: var(--ink);
  font-family: var(--serif);
  font-size: 1rem;
  line-height: 1.45;
}

/* =========================================================
   SEARCH SHEET
   ========================================================= */

.search-sheet {
  width: min(100%, 760px);
}

.search-input-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 9px 0 25px;
  padding: 0 0 10px;
  border-bottom: 1px solid var(--line-strong);
}

.search-input {
  width: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font-family: var(--serif);
  font-size: 1.65rem;
}

.search-input::placeholder {
  color: var(--muted);
}

.search-results {
  border-top: 1px solid var(--line);
}

.search-result {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  min-height: 64px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}

.search-result-name {
  font-family: var(--serif);
  font-size: 1rem;
}

.search-result-category {
  margin-top: 4px;
  color: var(--muted);
  font-size: .58rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
}

.search-result-price {
  color: var(--green);
  font-size: .75rem;
  font-weight: 700;
  white-space: nowrap;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (min-width: 700px) {
  .app {
    padding-left: 42px;
    padding-right: 42px;
  }

  .site-header {
    padding-top: 42px;
  }

  .category-name {
    font-size: 1.32rem;
  }

  .menu-item {
    min-height: 86px;
  }

  .item-name {
    font-size: 1.18rem;
  }

  .sheet {
    padding-left: 42px;
    padding-right: 42px;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- =====================================================
       HOME VIEW
       ===================================================== -->

  <main id="homeView" class="view active">

    <header class="site-header">

      <div class="brand">
        <h1 class="brand-name">NECTAR</h1>

        <div class="brand-subtitle">
          LOUNGE · BAR · KITCHEN
        </div>

        <!-- Lightweight inline SVG botanical mark -->
        <svg
          class="botanical"
          viewBox="0 0 90 105"
          aria-hidden="true"
        >
          <path
            d="M21 88 C30 67 38 48 54 28 C62 18 69 12 76 8"
            class="stem"
          />

          <ellipse
            cx="54"
            cy="30"
            rx="10"
            ry="4"
            transform="rotate(-38 54 30)"
          />

          <ellipse
            cx="66"
            cy="19"
            rx="9"
            ry="3.5"
            transform="rotate(-26 66 19)"
          />

          <ellipse
            class="fruit"
            cx="38"
            cy="56"
            rx="13"
            ry="11"
            transform="rotate(-25 38 56)"
          />

          <path
            d="M31 51 C35 47 40 46 44 48"
            class="fruit"
          />
        </svg>
      </div>

      <div class="language-switcher" aria-label="Language">
        <button class="language-button active" data-lang="ru">RU</button>
        <button class="language-button" data-lang="kz">KZ</button>
        <button class="language-button" data-lang="en">EN</button>
      </div>

    </header>

    <div class="editorial-rule">
      <span data-i18n="choose">выберите раздел</span>
    </div>

    <!-- FOOD -->
    <section class="menu-group">

      <div class="section-heading">
        <h2 data-i18n="food">Еда</h2>
        <span>01</span>
      </div>

      <div id="foodCategories" class="category-list"></div>

    </section>

    <!-- DRINKS -->
    <section class="menu-group">

      <div class="section-heading">
        <h2 data-i18n="drinks">Напитки</h2>
        <span>02</span>
      </div>

      <div class="category-list">

        <button
          class="category-item"
          data-action="openCategory"
          data-category="nonAlcoholic"
        >
          <span class="category-number">01</span>

            Безалкогольные
          </span>
          <span class="category-arrow">→</span>

        <!-- Cocktail section intentionally hidden until content exists -->
      </div>

    </section>

    <!-- SEARCH -->

      <span data-i18n="search">Поиск по меню</span>
      <span class="search-icon">⌕</span>
    </button>

    <!-- FOOTER -->
    <footer class="footer">

      <section class="footer-section">

        <h2 class="footer-title" data-i18n="guestInfo">
          Информация для гостей
        </h2>

        <div class="footer-links">

          <div class="footer-link">
            <span data-i18n="consumerCorner">
              Уголок потребителя
            </span>
            <span>01</span>
          </div>

          <div class="footer-link">
            <span data-i18n="allergens">
              Аллергены
            </span>
            <span>02</span>
          </div>

          <div class="footer-link">
            <span data-i18n="rules">
              Правила посещения
            </span>
            <span>03</span>
          </div>

          <div class="footer-link">
            <span data-i18n="payment">
              Оплата
            </span>
            <span>04</span>
          </div>

          <div class="footer-link">
            <span data-i18n="details">
              Реквизиты
            </span>
            <span>05</span>
          </div>

        </div>

      </section>

      <section class="footer-section">

        <h2 class="footer-title" data-i18n="contacts">
          Контакты
        </h2>

        <div class="contact-actions">

          <a

          >
            <span data-i18n="call">Позвонить</span>
            <span>+7 706 427 32 69</span>
          </a>

          <a

      </section>

      <div class="footer-brand">NECTAR</div>

      <div class="footer-small">
        Lounge · Bar · Kitchen
      </div>

    </footer>

  </main>


  <!-- =====================================================
       CATEGORY VIEW
       ===================================================== -->

  <main id="categoryView" class="view">

    <div class="page-top">

      <button
        class="back-button"
        id="backToHome"
      >
        ← <span data-i18n="back">Назад</span>
      </button>

      <span
        class="page-number"
        id="pageNumber"
      ></span>

    </div>

    <h1
      class="page-title"
      id="categoryTitle"
    ></h1>

    <div
      id="itemList"
      class="item-list"
    ></div>

  </main>

</div>


<!-- =========================================================
     DISH DETAIL SHEET
     ========================================================= -->

<div
  class="overlay"
  id="dishOverlay"
  aria-hidden="true"
>

  <section
    class="sheet"
    id="dishSheet"
    role="dialog"
    aria-modal="true"
    aria-label="Блюдо"
  >

    <div class="sheet-handle"></div>

    <div class="sheet-close-row">
      <button
        class="close-button"
        data-close="dish"
        aria-label="Закрыть"
      >
        ×
      </button>
    </div>

    <!-- Future photo goes here -->
    <img
      class="sheet-photo"
      id="sheetPhoto"
      src=""
      alt=""
      loading="lazy"
    >

    <div
      class="sheet-category"
      id="sheetCategory"
    ></div>

    <h2
      class="sheet-title"
      id="sheetTitle"
    ></h2>

    <div
      class="sheet-price"
      id="sheetPrice"
    ></div>

    <div class="sheet-info">

      <div class="info-block">

        <div
          class="info-label"

/* =========================================================
   STATE
   ========================================================= */

let currentLanguage =
  localStorage.getItem("nectar-language") || "ru";

let currentCategory = null;


/* =========================================================
   DOM
   ========================================================= */

const homeView = document.getElementById("homeView");
const categoryView = document.getElementById("categoryView");

const foodCategories =
  document.getElementById("foodCategories");

const categoryTitle =
  document.getElementById("categoryTitle");

const categoryNumber =
  document.getElementById("pageNumber");

const itemList =
  document.getElementById("itemList");

const backToHome =
  document.getElementById("backToHome");

const dishOverlay =
  document.getElementById("dishOverlay");

const dishSheet =
  document.getElementById("dishSheet");

const sheetPhoto =
  document.getElementById("sheetPhoto");

const sheetCategory =
  document.getElementById("sheetCategory");

const sheetTitle =
  document.getElementById("sheetTitle");

const sheetPrice =
  document.getElementById("sheetPrice");

const sheetYield =
  document.getElementById("sheetYield");

const sheetComposition =
  document.getElementById("sheetComposition");

const searchOverlay =
  document.getElementById("searchOverlay");

const searchInput =
  document.getElementById("searchInput");

const searchResults =
  document.getElementById("searchResults");


/* =========================================================
   HELPERS
   ========================================================= */

function money(value) {
  return new Intl.NumberFormat("ru-RU").format(value) + " ₸";
}

function getCategoryName(category) {
  return category.names[currentLanguage] || category.names.ru;
}

function getItemName(item) {
  /*
    When accurate professional translations are supplied,
    add them here without changing the data structure.

    Until then the original dish name remains intact rather
    than inventing potentially incorrect culinary terminology.
  */
  return item[0];
}

function getItemNote(item) {
  return item[2] || "";
}

function allCategories() {
  return [
    ...MENU.food,
    MENU.nonAlcoholic
  ];
}

function allItems() {
  const result = [];

  MENU.food.forEach(category => {
    category.items.forEach(item => {
      result.push({
        category,
        item
      });
    });
  });

  MENU.nonAlcoholic.items.forEach(item => {
    result.push({
      category: MENU.nonAlcoholic,
      item
    });
  });

  return result;
}


/* =========================================================
   LANGUAGE
   ========================================================= */

function applyLanguage() {

  document.documentElement.lang = currentLanguage;

  localStorage.setItem(
    "nectar-language",
    currentLanguage
  );

  document
    .querySelectorAll("[data-i18n]")
    .forEach(element => {

      const key = element.dataset.i18n;

      if (UI[currentLanguage][key]) {
        element.textContent =
          UI[currentLanguage][key];
      }

    });

  document
    .querySelectorAll(".language-button")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.lang === currentLanguage
      );

    });

  searchInput.placeholder =
    UI[currentLanguage].searchPlaceholder;

  if (currentCategory) {
    renderCategory(currentCategory);
  }

  renderFoodCategories();
}


/* =========================================================
   HOME CATEGORIES
   ========================================================= */

function renderFoodCategories() {

  foodCategories.innerHTML = "";

  MENU.food.forEach(category => {

    const button =
      document.createElement("button");

    button.className = "category-item";

    button.dataset.action = "openCategory";
    button.dataset.category = category.id;

    button.innerHTML = `
      <span class="category-number">
        ${category.number}
      </span>

      <span class="category-name">
        ${escapeHTML(getCategoryName(category))}
      </span>

      <span class="category-arrow">
        →
      </span>
    `;

    foodCategories.appendChild(button);

  });
}


/* =========================================================
   CATEGORY
   ========================================================= */

function findCategory(id) {

  if (id === "nonAlcoholic") {
    return MENU.nonAlcoholic;
  }

  return MENU.food.find(
    category => category.id === id
  );
}

function openCategory(id) {

  const category = findCategory(id);

  if (!category) return;

  currentCategory = category;

  renderCategory(category);

  homeView.classList.remove("active");
  categoryView.classList.add("active");

  window.scrollTo({
    top: 0,
    behavior: "instant"
  });

  history.pushState(
    { category: id },
    "",
    "#" + id
  );
}

function renderCategory(category) {

  categoryTitle.textContent =
    getCategoryName(category);

  categoryNumber.textContent =
    "SECTION " + category.number;

  itemList.innerHTML = "";

  category.items.forEach((item, index) => {

    const button =
      document.createElement("button");

    button.className = "menu-item";

    button.dataset.itemIndex = index;

    button.innerHTML = `
      <span>
        <span class="item-name">
          ${escapeHTML(getItemName(item))}
        </span>

        ${
          getItemNote(item)
            ? `
              <span class="item-note">
                ${escapeHTML(getItemNote(item))}
              </span>
            `
            : ""
        }
      </span>

      <span class="item-price">
        ${money(item[1])}
      </span>
    `;

    button.addEventListener(
      "click",
      () => openDish(category, item)
    );

    itemList.appendChild(button);

  });
}


/* =========================================================
   DISH
   ========================================================= */

function openDish(category, item) {

  sheetCategory.textContent =
    getCategoryName(category);

  sheetTitle.textContent =
    getItemName(item);

  sheetPrice.textContent =
    money(item[1]);

  /*
    Intentionally blank until the restaurant provides
    verified serving weight and composition.
  */
  sheetYield.textContent = "—";

  sheetComposition.textContent =
    "—";

  /*
    Future photo:
    item[3] can contain a relative path such as
    assets/photos/caesar.webp

    The architecture is already ready for it.
  */

  if (item[3]) {

    sheetPhoto.src = item[3];
    sheetPhoto.alt = getItemName(item);

    dishSheet.classList.add("has-photo");

  } else {

    sheetPhoto.removeAttribute("src");
    sheetPhoto.alt = "";

    dishSheet.classList.remove("has-photo");

  }

  openOverlay(dishOverlay);
}


/* =========================================================
   OVERLAYS
   ========================================================= */

function openOverlay(overlay) {

  overlay.classList.add("open");
  overlay.setAttribute("aria-hidden", "false");

  document.body.style.overflow = "hidden";

  setTimeout(() => {

    const input =
      overlay.querySelector("input");

    if (input) {
      input.focus();
    }

  }, 250);
}

function closeOverlay(overlay) {

  overlay.classList.remove("open");
  overlay.setAttribute("aria-hidden", "true");

  if (
    !dishOverlay.classList.contains("open") &&
    !searchOverlay.classList.contains("open")
  ) {
    document.body.style.overflow = "";
  }
}


/* =========================================================
   SEARCH
   ========================================================= */

function renderSearchResults(query = "") {

  const normalized =
    query.trim().toLowerCase();

  searchResults.innerHTML = "";

  if (!normalized) {
    return;
  }

  const results =
    allItems()
      .filter(({ item }) =>
        getItemName(item)
          .toLowerCase()
          .includes(normalized)
      )
      .slice(0, 30);

  if (!results.length) {

    searchResults.innerHTML = `
      <div
        style="
          padding:24px 0;
          color:var(--muted);
          font-size:.8rem;
        "
      >
        Ничего не найдено
      </div>
    `;

    return;
  }

  results.forEach(({ category, item }) => {

    const button =
      document.createElement("button");

    button.className = "search-result";
    button.type = "button";

    button.innerHTML = `
      <span>
        <span class="search-result-name">
          ${escapeHTML(getItemName(item))}
        </span>

        <span class="search-result-category">
          ${escapeHTML(getCategoryName(category))}
        </span>
      </span>

      <span class="search-result-price">
        ${money(item[1])}
      </span>
    `;

    button.addEventListener("click", () => {

      closeOverlay(searchOverlay);

      setTimeout(() => {

        openCategory(category.id);

        setTimeout(() => {
          openDish(category, item);
        }, 120);

      }, 180);

    });

    searchResults.appendChild(button);

  });
}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================================================
   EVENTS
   ========================================================= */

document.addEventListener(
  "click",
  event => {

    const categoryButton =
      event.target.closest(
        '[data-action="openCategory"]'
      );

    if (categoryButton) {

      openCategory(
        categoryButton.dataset.category
      );

      return;
    }

    if (
      event.target === dishOverlay
    ) {
      closeOverlay(dishOverlay);
    }

    if (
      event.target === searchOverlay
    ) {
      closeOverlay(searchOverlay);
    }

  }
);


/* Language buttons */

document
  .querySelectorAll(".language-button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        currentLanguage =
          button.dataset.lang;

        applyLanguage();

      }
    );

  });


/* Back */

backToHome.addEventListener(
  "click",
  () => {

    currentCategory = null;

    categoryView.classList.remove("active");
    homeView.classList.add("active");

    history.pushState(
      {},
      "",
      window.location.pathname
    );

    window.scrollTo({
      top: 0,
      behavior: "instant"
    });

  }
);


/* Search */

document
  .getElementById("searchTrigger")
  .addEventListener(
    "click",
    () => {

      openOverlay(searchOverlay);

      searchInput.value = "";
      searchResults.innerHTML = "";

    }
  );

searchInput.addEventListener(
  "input",
  () => {
    renderSearchResults(
      searchInput.value
    );
  }
);


/* Close buttons */

document
  .querySelectorAll("[data-close]")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        if (
          button.dataset.close === "dish"
        ) {
          closeOverlay(dishOverlay);
        }

        if (
          button.dataset.close === "search"
        ) {
          closeOverlay(searchOverlay);
        }

      }
    );

  });


/* Escape */

document.addEventListener(
  "keydown",
  event => {

    if (event.key !== "Escape") {
      return;
    }

    if (dishOverlay.classList.contains("open")) {
      closeOverlay(dishOverlay);
      return;
    }

    if (searchOverlay.classList.contains("open")) {
      closeOverlay(searchOverlay);
    }

  }
);


/* Browser back */

window.addEventListener(
  "popstate",
  () => {

    currentCategory = null;

    categoryView.classList.remove("active");
    homeView.classList.add("active");

  }
);


/* =========================================================
   INITIALIZE
   ========================================================= */

applyLanguage();

</script>
