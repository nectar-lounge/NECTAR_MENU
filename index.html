<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NECTAR | Lounge Bar Kitchen</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <!-- Временно стоит иконка персика, потом заменим на логотип -->
            <div class="logo-icon">🍑</div>
            <div class="logo">NECTAR</div>
            <div class="subtitle">LOUNGE BAR KITCHEN</div>
        </div>
        <div class="lang-switcher">
            <button class="lang-btn active" data-lang="ru">RU</button>
            <button class="lang-btn" data-lang="kz">KZ</button>
            <button class="lang-btn" data-lang="en">EN</button>
        </div>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Поиск по меню..." autocomplete="off">
    </div>

    <nav class="category-nav">
        <button class="nav-btn active" data-target="food">Еда</button>
        <button class="nav-btn" data-target="soft">Напитки</button>
        <button class="nav-btn" data-target="bar">Бар</button>
        <button class="nav-btn" data-target="info">Инфо</button>
        <button class="nav-btn" data-target="contacts">Контакты</button>
    </nav>

    <main id="app-content">
        <!-- Сюда JS загрузит меню -->
    </main>

    <footer class="footer">
        <p class="allergy-warning" data-i18n="allergy">ПРОСИМ СООБЩИТЬ ОФИЦИАНТУ ОБ ИМЕЮЩИХСЯ АЛЛЕРГИЯХ</p>
        <p class="currency-warning" data-i18n="currency">ВСЕ ЦЕНЫ УКАЗАНЫ В ТЕНГЕ</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
