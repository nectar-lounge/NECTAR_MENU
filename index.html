    let currentType = 'kitchen';
    let currentCategory = 'All';

    // Tab Switching Logic
    function switchMainTab(index, btn) {
        const indicator = document.getElementById('nav-indicator');
        const buttons = document.querySelectorAll('.nav-btn');
        
        // Update indicator position
        indicator.style.transform = `translateX(${index * 100}%)`;
        
        // Update text colors
        buttons.forEach((b, i) => {
            if(i === index) {
                b.classList.replace('text-on-surface-variant', 'text-on-primary');
            } else {
                b.classList.replace('text-on-primary', 'text-on-surface-variant');
            }
        });

        currentType = btn.dataset.type;
        currentCategory = 'All';
        renderCategories();
        renderMenu();
    }

    function renderCategories() {
        const container = document.getElementById('categoryContainer');
        const items = MENU.filter(item => item.type === currentType);
        const categories = ['All', ...new Set(items.map(item => item.category))];
        
        container.innerHTML = categories.map(cat => `
            <button class="snap-start shrink-0 px-6 py-2 ${currentCategory === cat ? 'bg-[#1b3022] text-on-primary border-[#1b3022]' : 'bg-white/60 backdrop-blur-md text-on-surface-variant border-[rgba(169,121,53,0.15)] shadow-[0_2px_8px_rgba(169,121,53,0.05)]'} rounded-full text-label-caps font-label-caps transition-transform active:scale-95 border hover:border-[rgba(169,121,53,0.3)]" onclick="selectCategory('${cat}')">${cat}</button>
        `).join('');
    }

    function selectCategory(category) {
        currentCategory = category;
        renderCategories();
        renderMenu();
    }

    function renderMenu(searchQuery = '') {
        const container = document.getElementById('menuContainer');
        let allItems = MENU.filter(item => item.type === currentType);
        
        if (searchQuery) {
            allItems = allItems.filter(item => item.name.toLowerCase().includes(searchQuery.toLowerCase()));
        }

        let categoriesToRender = [];
        if (currentCategory === 'All') {
            categoriesToRender = [...new Set(allItems.map(i => i.category))];
        } else {
            categoriesToRender = [currentCategory];
        }

        let html = '';

        categoriesToRender.forEach((cat, index) => {
            const catItems = allItems.filter(i => i.category === cat);
            if (catItems.length > 0) {
                html += `
                    <div class="mt-8 mb-4 fade-in" style="animation-delay: ${index * 0.05}s; opacity: 0;">
                        <div class="flex items-center justify-center gap-4 mb-6">
                            <div class="w-12 h-[1px] bg-[rgba(169,121,53,0.3)] relative"><div class="absolute right-0 top-1/2 -translate-y-1/2 w-1.5 h-1.5 rotate-45 bg-[rgba(169,121,53,0.3)]"></div></div>
                            <h2 class="font-headline-md text-[28px] text-[#1b3022] tracking-tight text-center font-serif">${cat}</h2>
                            <div class="w-12 h-[1px] bg-[rgba(169,121,53,0.3)] relative"><div class="absolute left-0 top-1/2 -translate-y-1/2 w-1.5 h-1.5 rotate-45 bg-[rgba(169,121,53,0.3)]"></div></div>
                        </div>
                        <div class="flex flex-col gap-4">
                `;
                catItems.forEach(item => {
                    const itemData = JSON.stringify(item).replace(/"/g, '&quot;');
                    html += `
                        <div class="group bg-[#fdfaf5] backdrop-blur-sm rounded-3xl overflow-hidden shadow-[0_4px_12px_rgba(169,121,53,0.05)] flex flex-col cursor-pointer transition-transform duration-300 active:scale-[0.98] border border-[rgba(169,121,53,0.15)] hover:border-[rgba(169,121,53,0.3)]" onclick='openModal(${itemData})'>
                            <div class="px-6 py-6 relative">
                                <div class="flex justify-between items-start gap-4">
                                    <h3 class="font-headline-sm text-[20px] md:text-headline-sm text-[#1b3022] max-w-[75%] leading-tight font-serif">${item.name}</h3>
                                    <p class="font-body-lg font-bold text-[18px] md:text-[20px] text-[#a97935] whitespace-nowrap">${item.price} ₸</p>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div></div>`;
            }
        });

        if (html === '') {
            html = `<div class="text-center py-12 text-on-surface-variant text-body-md">No items found.</div>`;
        }
        container.innerHTML = html;
    }

    function openModal(item) {
        const modal = document.getElementById('itemModal');
        const modalContent = modal.querySelector('.relative');
        
        document.getElementById('modalTitle').textContent = item.name;
        document.getElementById('modalPrice').textContent = `${item.price} ₸`;
        document.getElementById('modalWeight').textContent = item.weight || '';
        
        const descContainer = document.getElementById('modalDescContainer');
        const ingredientsContainer = document.getElementById('modalIngredientsContainer');
        const ingredientsList = document.getElementById('modalIngredients');
        
        if (item.composition) {
            // Very basic heuristic: if it looks like a list of ingredients (comma separated, short), show as tags. Else text.
            const parts = item.composition.split(',').map(s => s.trim()).filter(s => s);
            
            if (parts.length > 1 && parts.every(p => p.length < 30)) {
                descContainer.classList.add('hidden');
                ingredientsContainer.classList.remove('hidden');
                ingredientsContainer.classList.add('flex');
                
                ingredientsList.innerHTML = parts.map(part => 
                    `<span class="px-4 py-2 bg-secondary-container text-on-secondary-container rounded-lg font-body-md text-body-md shadow-[0_2px_8px_rgba(27,48,34,0.03)]">${part}</span>`
                ).join('');
            } else {
                descContainer.classList.remove('hidden');
                ingredientsContainer.classList.add('hidden');
                ingredientsContainer.classList.remove('flex');
                document.getElementById('modalDesc').textContent = item.composition;
            }
        } else {
            descContainer.classList.add('hidden');
            ingredientsContainer.classList.add('hidden');
            ingredientsContainer.classList.remove('flex');
        }

        modal.classList.remove('hidden');
        modal.classList.add('flex');
        modalContent.classList.add('modal-enter');
        
        // Prevent background scrolling
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        const modal = document.getElementById('itemModal');
        const modalContent = modal.querySelector('.relative');
        
        modalContent.classList.remove('modal-enter');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        
        // Restore background scrolling
        document.body.style.overflow = '';
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
        renderMenu(e.target.value);
    });

    // Initialize
    renderCategories();
    renderMenu();
    switchLang(currentLang);
