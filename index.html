<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NECTAR — Lounge Kitchen Bar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="logo-area">
      <h1>Nectar</h1>
      <span>Lounge Kitchen Bar • Almaty</span>
    </div>
    <!-- Переключатель языка -->
    <div class="lang-switcher">
      <select id="langSelect" style="background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 6px;">
        <option value="RU">RU</option>
        <option value="EN">EN</option>
        <option value="KZ">KZ</option>
      </select>
    </div>
  </header>

  <div class="controls-container">
    <div class="tabs-main">
      <button class="tab-btn active" data-tab="kitchen" id="tabKitchen">Кухня</button>
      <button class="tab-btn" data-tab="bar" id="tabBar">Бар</button>
      <button class="tab-btn" data-tab="info" id="tabInfo">Инфо</button>
    </div>

    <!-- Подкатегории (скрываются на вкладке Инфо) -->
    <div class="subcategories-scroll" id="subcategoriesContainer">
      <!-- Динамически заполнится из JS -->
    </div>
  </div>

  <!-- Основной контейнер меню -->
  <main class="menu-container" id="menuContainer">
    <!-- Блюда или Уголок потребителя рендерятся сюда -->
  </main>

  <script src="app.js"></script>
</body>
</html>
