<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <title>NECTAR | Lounge • Bar • Kitchen</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "forest-green": "#1b3022",
                        "warm-gold": "#a97935",
                        "cream": "#fbf9f6",
                        "nectar-accent": "#e1743d"
                    },
                    fontFamily: {
                        "serif-ru": ["Cormorant Garamond", "serif"],
                        "body": ["Manrope", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-cream font-body text-forest-green">

    <header class="fixed top-0 inset-x-0 z-50 glass-effect pt-safe border-b border-forest-green/5">
        <div class="px-6 flex items-center justify-between relative h-20">
            <div class="min-w-[80px]"></div>
            <div class="absolute left-1/2 -translate-x-1/2 flex flex-col items-center text-center">
                <h1 class="font-serif-ru text-[28px] text-forest-green tracking-wider font-medium leading-none">NECTAR</h1>
                <p class="text-[9px] tracking-[0.25em] uppercase mt-1 text-warm-gold font-semibold">Lounge · Bar · Kitchen</p>
            </div>
            <div class="flex items-center gap-2 justify-end min-w-[80px]">
                <button class="lang-btn lang-active" onclick="switchLang('RU')">RU</button>
                <span class="text-forest-green/20 text-[10px]">/</span>
                <button class="lang-btn" onclick="switchLang('KZ')">KZ</button>
                <span class="text-forest-green/20 text-[10px]">/</span>
                <button class="lang-btn" onclick="switchLang('EN')">EN</button>
            </div>
        </div>
    </header>

    <main class="flex flex-col relative w-full pb-32 pt-20">
        
        <section class="spa-section active flex-col w-full" id="menu-section">
            <div class="w-full h-64 relative -mt-4 mb-4 z-0 overflow-hidden bg-forest-green">
                <img alt="Nectar Atmosphere" class="w-full h-full object-cover mix-blend-multiply opacity-90" src="https://lh3.googleusercontent.com/aida/AEtjO1VfckORHX18V6pYkQT8N5yS9yA9sBXpVR9MhYawqAJMa6Xbm6ZQYqU9LL7UaqgjdLtKEFkd-RrEq7PZjXdhVCCwND2Z5DuMATgyoKbTQT35y373wzkqGR4vlge_G9Vgi3Nh9jCJ5JQQhc_SW4dk8AH_36BTha7h-XDx-OsSYpBDcoX0NVZDXi-oLnBW6hfKkAJZU8WPwLvjBiLKre4Z4SKjWd_2ZzhWur3FCVLKRHCF3M4LjtCnuF5h-A"/>
                <div class="absolute inset-0 bg-gradient-to-t from-cream via-cream/40 to-transparent"></div>
            </div>

            <div class="flex flex-col w-full px-5 relative z-10 -mt-12">
                <div class="sticky z-40 bg-cream/95 backdrop-blur-md pt-2 pb-4 -mx-5 px-5 border-b border-forest-green/5 top-20">
                    <div class="flex items-center gap-3 bg-white px-5 py-3 rounded-2xl border border-forest-green/5 shadow-sm">
                        <span class="material-symbols-outlined text-forest-green/40 text-[20px]">search</span>
                        <input id="searchInput" type="text" class="flex-1 bg-transparent border-none outline-none focus:ring-0 text-sm text-forest-green placeholder:text-forest-green/40" placeholder="Поиск блюд, напитков..."/>
                    </div>

                    <div class="flex justify-center mt-3">
                        <div class="flex items-center bg-white border border-forest-green/5 rounded-2xl p-1 shadow-sm w-full max-w-sm relative">
                            <div id="nav-indicator" class="absolute left-1 top-1 bottom-1 w-[calc(50%-4px)] bg-forest-green rounded-xl transition-transform duration-300"></div>
                            <button class="nav-btn flex-1 relative z-10 py-2.5 text-[11px] tracking-[0.2em] text-cream uppercase font-semibold" onclick="switchMainTab(0, this)" data-type="kitchen">Кухня</button>
                            <button class="nav-btn flex-1 relative z-10 py-2.5 text-[11px] tracking-[0.2em] text-forest-green/60 uppercase font-semibold" onclick="switchMainTab(1, this)" data-type="bar">Бар</button>
                        </div>
                    </div>

                    <div id="categoryContainer" class="flex overflow-x-auto gap-2 pb-1 mt-3 snap-x hide-scrollbar"></div>
                </div>

                <div id="menuContainer" class="flex flex-col mt-4 gap-3"></div>
            </div>
        </section>

        <section class="spa-section flex-col w-full px-5 pt-6 pb-12" id="info-section">
            <div id="infoContainer" class="flex flex-col gap-4"></div>
        </section>
    </main>

    <nav class="fixed bottom-0 inset-x-0 z-50 pb-safe glass-effect border-t border-forest-green/15">
        <div class="flex justify-around items-center h-[72px] px-8">
            <button class="flex flex-col items-center text-forest-green transition-opacity" onclick="switchSection('menu', this)" data-path="menu">
                <span class="material-symbols-outlined text-[24px]">restaurant_menu</span>
                <span class="text-[9px] tracking-[0.2em] uppercase mt-1 font-semibold">Меню</span>
            </button>
            <button class="flex flex-col items-center text-forest-green/40 transition-opacity" onclick="switchSection('info', this)" data-path="info">
                <span class="material-symbols-outlined text-[24px]">info</span>
                <span class="text-[9px] tracking-[0.2em] uppercase mt-1 font-semibold">Инфо</span>
            </button>
        </div>
    </nav>

    <!-- Модальное окно с правильной архитектурой данных -->
    <div id="itemModal" class="fixed inset-0 z-[100] hidden items-center justify-center px-4">
        <div class="absolute inset-0 bg-forest-green/60 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="relative bg-cream w-full max-w-md rounded-[32px] overflow-hidden flex flex-col max-h-[85vh] shadow-2xl z-10 border border-forest-green/10">
            <div id="modalImageContainer" class="w-full h-64 bg-forest-green/5 hidden relative">
                <img id="modalImage" src="" class="w-full h-full object-cover" alt="">
                <div class="absolute inset-0 bg-gradient-to-t from-cream via-transparent to-transparent"></div>
            </div>
            <div class="p-7 flex flex-col gap-4 overflow-y-auto">
                <div class="flex justify-between items-start gap-4">
                    <h3 id="modalTitle" class="font-serif-ru text-[26px] text-forest-green font-medium leading-tight"></h3>
                    <button class="w-9 h-9 rounded-full bg-forest-green/5 flex items-center justify-center text-forest-green" onclick="closeModal()">
                        <span class="material-symbols-outlined text-[18px]">close</span>
                    </button>
                </div>
                
                <div class="flex items-baseline justify-between border-b border-warm-gold/20 pb-4">
                    <span id="modalPrice" class="font-serif-ru text-[28px] text-warm-gold font-medium"></span>
                    <span id="modalWeight" class="text-[13px] text-forest-green/60 font-light tracking-wide hidden"></span>
                </div>

                <div id="modalDescriptionContainer" class="flex flex-col gap-1.5 hidden">
                    <h4 class="text-[10px] tracking-[0.2em] text-forest-green/40 uppercase font-semibold">Состав / Описание</h4>
                    <p id="modalDescription" class="text-[14px] text-forest-green/80 font-serif-ru leading-relaxed"></p>
                </div>
            </div>
            <div class="p-5 mt-auto bg-cream/90 border-t border-forest-green/5">
                <button class="w-full py-3.5 bg-forest-green text-cream rounded-2xl text-[11px] tracking-[0.2em] uppercase font-semibold shadow-md" onclick="closeModal()">Закрыть</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
