<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
    <title>NECTAR | Lounge • Bar • Kitchen</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "forest-green": "#1b3022",
                        "warm-gold": "#a97935",
                        "cream": "#fbf9f6",
                        "nectar-accent": "#e1743d"
                    },
                    fontFamily: {
                        "serif-ru": ["Cormorant Garamond", "serif"],
                        "body": ["Manrope", "sans-serif"]
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-cream font-body text-forest-green">
    
    <!-- Премиальный шапка-хедер -->
    <header class="fixed top-0 inset-x-0 z-50 glass-effect pt-safe border-b border-forest-green/5">
        <div class="px-6 flex items-center justify-between relative h-20">
            <div class="min-w-[80px]"></div>
            <div class="absolute left-1/2 -translate-x-1/2 flex flex-col items-center text-center">
                <h1 class="font-serif-ru text-[30px] text-forest-green tracking-wider font-medium leading-none">NECTAR</h1>
                <p class="text-[9px] tracking-[0.25em] uppercase mt-1 text-warm-gold font-semibold" data-i18n="header_subtitle">Lounge · Bar · Kitchen</p>
            </div>
            <div class="flex items-center gap-2 justify-end min-w-[80px]">
                <button aria-label="RU" class="lang-btn lang-active" onclick="switchLang('RU')">RU</button>
                <span class="text-forest-green/20 text-[10px]">/</span>
                <button aria-label="KZ" class="lang-btn" onclick="switchLang('KZ')">KZ</button>
                <span class="text-forest-green/20 text-[10px]">/</span>
                <button aria-label="EN" class="lang-btn" onclick="switchLang('EN')">EN</button>
            </div>
        </div>
    </header>

    <main class="flex flex-col relative w-full pb-32 pt-20">
        
        <!-- СЕКЦИЯ МЕНЮ -->
        <section class="spa-section active flex-col w-full" id="menu-section">
            
            <!-- Hero баннер с глубоким погружением -->
            <div class="w-full h-72 relative -mt-4 mb-4 z-0 overflow-hidden bg-forest-green">
                <img alt="Nectar Atmosphere" class="w-full h-full object-cover mix-blend-overlay opacity-80 hero-float" src="https://lh3.googleusercontent.com/aida/AEtjO1VfckORHX18V6pYkQT8N5yS9yA9sBXpVR9MhYawqAJMa6Xbm6ZQYqU9LL7UaqgjdLtKEFkd-RrEq7PZjXdhVCCwND2Z5DuMATgyoKbTQT35y373wzkqGR4vlge_G9Vgi3Nh9jCJ5JQQhc_SW4dk8AH_36BTha7h-XDx-OsSYpBDcoX0NVZDXi-oLnBW6hfKkAJZU8WPwLvjBiLKre4Z4SKjWd_2ZzhWur3FCVLKRHCF3M4LjtCnuF5h-A"/>
                <div class="absolute inset-0 bg-gradient-to-t from-cream via-cream/20 to-transparent"></div>
            </div>

            <div class="flex flex-col w-full px-5 relative z-10 -mt-14">
                <div class="sticky z-40 bg-cream/90 backdrop-blur-2xl pt-2 pb-4 -mx-5 px-5 border-b border-forest-green/5 top-20">
                    
                    <!-- Поисковая строка -->
                    <div class="search-bar flex items-center gap-3 bg-white px-5 py-3.5 rounded-2xl relative shadow-sm">
                        <span class="material-symbols-outlined text-forest-green/40 text-[20px]">search</span>
                        <input id="searchInput" type="text" class="flex-1 bg-transparent border-none outline-none focus:ring-0 focus:outline-none text-sm placeholder:text-forest-green/40 text-forest-green font-light" placeholder="Поиск блюд, напитков..." data-i18n-placeholder="search_placeholder"/>
                        <button id="clearSearchBtn" class="hidden absolute right-4 text-forest-green/40 hover:text-forest-green transition-colors" onclick="clearSearch()">
                            <span class="material-symbols-outlined text-[18px]">close</span>
                        </button>
                    </div>

                    <!-- Переключатель Кухня / Бар -->
                    <div class="flex justify-center mt-4">
                        <div class="flex items-center bg-white border border-forest-green/5 rounded-2xl p-1 shadow-sm relative w-full max-w-sm">
                            <div id="nav-indicator" class="absolute left-1 top-1 bottom-1 w-[calc(50%-4px)] bg-forest-green rounded-xl transition-transform duration-300 ease-out"></div>
                            <button class="nav-btn flex-1 relative z-10 py-2.5 text-[11px] tracking-[0.2em] text-cream uppercase font-semibold transition-colors" data-type="kitchen" onclick="switchMainTab(0, this)" data-i18n="nav_kitchen">Кухня</button>
                            <button class="nav-btn flex-1 relative z-10 py-2.5 text-[11px] tracking-[0.2em] text-forest-green/60 uppercase font-semibold transition-colors" data-type="bar" onclick="switchMainTab(1, this)" data-i18n="nav_bar">Бар</button>
                        </div>
                    </div>

                    <!-- Категории меню -->
                    <div id="categoryContainer" class="flex overflow-x-auto gap-2.5 pb-1 mt-4 snap-x snap-mandatory hide-scrollbar">
                    </div>
                </div>

                <!-- Список позиций меню -->
                <div id="menuContainer" class="flex flex-col pb-12 mt-4 gap-3">
                </div>
            </div>
        </section>

        <!-- СЕКЦИЯ ИНФО (О заведении) -->
        <section class="spa-section flex-col w-full px-5 pt-6 pb-12" id="info-section">
            <div id="infoContainer" class="flex flex-col gap-4"></div>
        </section>
    </main>

    <!-- Нижняя навигация (Bottom Bar) -->
    <nav class="fixed bottom-0 inset-x-0 z-50 pb-safe glass-effect border-t border-forest-green/10">
        <div class="flex justify-around items-center h-[72px] px-8">
            <button class="bottom-nav-btn text-forest-green flex flex-col items-center" data-path="menu" onclick="switchSection('menu', this)">
                <span class="material-symbols-outlined text-[24px]">restaurant_menu</span>
                <span class="text-[9px] tracking-[0.2em] uppercase mt-1 font-semibold" data-i18n="tab_menu">Меню</span>
            </button>
            <button class="bottom-nav-btn text-forest-green/40 flex flex-col items-center" data-path="info" onclick="switchSection('info', this)">
                <span class="material-symbols-outlined text-[24px]">info</span>
                <span class="text-[9px] tracking-[0.2em] uppercase mt-1 font-semibold" data-i18n="tab_info">Инфо</span>
            </button>
        </div>
    </nav>

    <!-- ПРЕМИАЛЬНОЕ МОДАЛЬНОЕ ОКНО -->
    <div id="itemModal" class="fixed inset-0 z-[100] hidden items-center justify-center px-4">
        <div class="absolute inset-0 bg-forest-green/60 backdrop-blur-md transition-opacity" onclick="closeModal()"></div>
        <div class="relative bg-cream w-full max-w-md rounded-[32px] overflow-hidden flex flex-col max-h-[85vh] shadow-2xl modal-glass z-10">
            
            <div id="modalImageContainer" class="w-full h-64 bg-forest-green/5 hidden relative overflow-hidden">
                <img id="modalImage" src="" class="w-full h-full object-cover" alt="Dish photo">
                <div class="absolute inset-0 bg-gradient-to-t from-cream via-transparent to-transparent"></div>
            </div>
            
            <div class="p-7 flex flex-col gap-5 relative z-10 overflow-y-auto">
                <div class="flex justify-between items-start gap-4">
                    <h3 id="modalTitle" class="font-serif-ru text-[28px] text-forest-green font-medium leading-tight"></h3>
                    <button aria-label="Закрыть" class="w-9 h-9 rounded-full bg-forest-green/5 flex items-center justify-center text-forest-green shrink-0 active:scale-95 transition-transform hover:bg-forest-green/10" onclick="closeModal()">
                        <span class="material-symbols-outlined text-[20px]">close</span>
                    </button>
                </div>
                
                <div class="flex items-center justify-between border-b border-warm-gold/20 pb-4">
                    <span id="modalPrice" class="font-serif-ru text-[26px] text-warm-gold font-medium"></span>
                    <span id="modalWeight" class="text-[12px] text-forest-green/60 border border-forest-green/10 px-3 py-1 rounded-full hidden bg-white font-medium"></span>
                </div>
                
                <div id="modalIngredientsContainer" class="flex-col gap-2 hidden">
                    <h4 class="text-[10px] tracking-[0.25em] text-forest-green/40 uppercase font-semibold" data-i18n="modal_ingredients">Состав</h4>
                    <p id="modalIngredients" class="text-[15px] text-forest-green/80 leading-relaxed font-light font-serif-ru"></p>
                </div>
            </div>
            
            <div class="p-5 mt-auto bg-cream/90 backdrop-blur-md border-t border-forest-green/5">
                <button class="w-full py-4 bg-forest-green text-cream rounded-2xl text-[11px] tracking-[0.2em] uppercase font-semibold shadow-lg shadow-forest-green/15 active:scale-[0.98] transition-transform" onclick="closeModal()" data-i18n="modal_close">Закрыть</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
