<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NECTAR — Lounge Kitchen Bar</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Шрифты и иконки при необходимости можно подключить здесь -->
</head>
<body>

    <!-- Шапка профиля -->
    <header class="header">
        <h1>NECTAR</h1>
        <p class="subtitle">Lounge Kitchen Bar • Алматы</p>
        
        <!-- Переключатель языков -->
        <div class="lang-switcher">
            <button onclick="setLanguage('ru')">RU</button>
            <button onclick="setLanguage('en')">EN</button>
            <button onclick="setLanguage('kz')">KZ</button>
        </div>
    </header>

    <!-- Основное меню категорий и подкатегорий -->
    <nav class="categories-nav" id="categories-nav">
        <!-- Скрипт сам отрисует категории, либо здесь твоя верстка -->
    </nav>

    <!-- Контейнер меню с вау-эффектом (плавное появление) -->
    <main class="menu-container" id="menu-container">
        <div class="menu-grid" id="menu-grid">
            <!-- Карточки блюд и позиций бара подгружаются сюда -->
        </div>
    </main>

    <!-- Секция Инфо / Уголок потребителя -->
    <section class="info-section">
        <details class="info-dropdown">
            <summary>Лицензия и регистрация</summary>
            <p>Информация о юридическом лице и разрешительных документах...</p>
        </details>
        <details class="info-dropdown">
            <summary>Правила обслуживания</summary>
            <p>Правила поведения и нахождения в Lounge Kitchen Bar Nectar...</p>
        </details>
        <details class="info-dropdown">
            <summary>Книга отзывов и предложений</summary>
            <p>Вы можете оставить свой отзыв или связаться с нами...</p>
        </details>
    </section>

    <script src="app.js"></script>
</body>
</html>
