                <button onclick="switchType('bar')" id="type-bar" class="flex-1 relative z-10 py-2.5 text-xs font-bold tracking-widest text-outline uppercase transition-colors">Бар</button>

            <div id="menuContainer" class="flex flex-col gap-3"></div>
        </section>

        let currentLang = 'RU';
        let currentType = 'kitchen';
        let currentCategory = 'All';

        function initApp() {
            updateInterfaceText();
            renderCategories();
            renderMenu();
        }

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('font-bold', 'text-forest-green');
                btn.classList.add('text-outline');
            });
            document.getElementById(`btn-${lang}`).classList.add('font-bold', 'text-forest-green');
            document.getElementById(`btn-${lang}`).classList.remove('text-outline');
            
            updateInterfaceText();
            renderCategories();
            renderMenu(document.getElementById('searchInput').value);
        }

        function updateInterfaceText() {
            const t = UI_TEXT[currentLang];
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('type-kitchen').textContent = t.kitchen;
            document.getElementById('type-bar').textContent = t.bar;
            document.getElementById('infoTitle').textContent = t.infoTitle;
            document.getElementById('infoSub').textContent = t.infoSub;
            document.getElementById('infoAddressTitle').textContent = t.addressTitle;
            document.getElementById('infoAddress').textContent = t.addressText;
            document.getElementById('infoMapLink').textContent = t.mapLink;
            document.getElementById('infoPhoneTitle').textContent = t.phoneTitle;
            document.getElementById('infoHours').textContent = t.hoursText;
            document.getElementById('navMenuText').textContent = t.navMenu;
            document.getElementById('navInfoText').textContent = t.navInfo;
            document.getElementById('modalIngTitle').textContent = t.ingTitle;
            document.getElementById('modalCloseBtn').textContent = t.closeBtn;
        }

        function switchType(type) {
            currentType = type;
            currentCategory = 'All';
            const indicator = document.getElementById('typeIndicator');
            const btnKitchen = document.getElementById('type-kitchen');
            const btnBar = document.getElementById('type-bar');

            if (type === 'kitchen') {
                indicator.style.transform = 'translateX(0)';
                btnKitchen.className = "flex-1 relative z-10 py-2.5 text-xs font-bold tracking-widest text-cream uppercase transition-colors";
                btnBar.className = "flex-1 relative z-10 py-2.5 text-xs font-bold tracking-widest text-outline uppercase transition-colors";
            } else {
                indicator.style.transform = 'translateX(100%)';
                btnBar.className = "flex-1 relative z-10 py-2.5 text-xs font-bold tracking-widest text-cream uppercase transition-colors";
                btnKitchen.className = "flex-1 relative z-10 py-2.5 text-xs font-bold tracking-widest text-outline uppercase transition-colors";
            }
            renderCategories();
            renderMenu();
        }

        function renderCategories() {
            const container = document.getElementById('categoryContainer');
            const searchQuery = document.getElementById('searchInput').value;
            
            if (searchQuery) {
                container.classList.add('hidden');
                return;
            } else {
                container.classList.remove('hidden');
            }

            const items = MENU.filter(item => item.type === currentType);
            const catKey = `category_${currentLang.toLowerCase()}`;
            const uniqueCats = [...new Set(items.map(i => i[catKey]))];
            
            const t = UI_TEXT[currentLang];
            const categories = [{ id: 'All', name: t.all }, ...uniqueCats.map(c => ({ id: c, name: c }))];

            container.innerHTML = categories.map(cat => `
                <button onclick="selectCategory('${cat.id.replace(/'/g, "\\'")}')" class="shrink-0 px-4 py-2 rounded-xl text-[11px] font-bold tracking-widest uppercase transition-all shadow-sm border ${
                    currentCategory === cat.id 
                    ? 'bg-forest-green text-cream border-forest-green' 
                    : 'bg-white text-outline border-forest-green/10 hover:border-forest-green/35'
                }">${cat.name}</button>
            `).join('');
        }

        function selectCategory(category) {
            currentCategory = category;
            renderCategories();
            renderMenu(document.getElementById('searchInput').value);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderMenu(searchQuery = '') {
            const container = document.getElementById('menuContainer');
            const nameKey = `name_${currentLang.toLowerCase()}`;
            const catKey = `category_${currentLang.toLowerCase()}`;
            const compKey = `composition_${currentLang.toLowerCase()}`;

            let filtered = MENU;
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(i => i[nameKey].toLowerCase().includes(q) || (i[compKey] && i[compKey].toLowerCase().includes(q)));
            } else {
                filtered = filtered.filter(i => i.type === currentType);
                if (currentCategory !== 'All') {
                    filtered = filtered.filter(i => i[catKey] === currentCategory);
                }
            }

            renderCategories();

            if (filtered.length === 0) {
                const t = UI_TEXT[currentLang];
                container.innerHTML = `<div class="text-center py-12 text-outline font-serif italic text-lg">${t.notFound}</div>`;
                return;
            }

            const categoriesToRender = [...new Set(filtered.map(i => i[catKey]))];
            let html = '';

            categoriesToRender.forEach(cat => {
                const catItems = filtered.filter(i => i[catKey] === cat);
                html += `
                    <div class="mt-4 mb-2">
                        <h2 class="font-serif text-xl text-forest-green font-semibold mb-3 px-1">${cat}</h2>
                        <div class="flex flex-col gap-2.5">
                `;
                catItems.forEach(item => {
                    const itemStr = JSON.stringify(item).replace(/"/g, '&quot;');
                    html += `
                        <div onclick='openModal(${itemStr})' class="bg-white rounded-2xl p-4 shadow-sm border border-forest-green/5 cursor-pointer hover:border-forest-green/20 transition-all flex justify-between items-start gap-4">
                            <div>
                                <h3 class="font-serif text-lg text-forest-green font-medium leading-tight mb-1">${item[nameKey]}</h3>
                                ${item[compKey] ? `<p class="text-xs text-outline line-clamp-1">${item[compKey]}</p>` : ''}
                            </div>
                            <span class="font-serif text-lg text-warm-gold font-semibold whitespace-nowrap">${item.price} ₸</span>
                        </div>
                    `;
                });
                html += `</div></div>`;
            });

            container.innerHTML = html;
        }

        function switchTab(tab) {
            document.querySelectorAll('.spa-section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`section-${tab}`).classList.remove('hidden');
            
            document.getElementById('nav-menu').className = tab === 'menu' ? "flex flex-col items-center gap-1 text-forest-green font-medium" : "flex flex-col items-center gap-1 text-outline";
            document.getElementById('nav-info').className = tab === 'info' ? "flex flex-col items-center gap-1 text-forest-green font-medium" : "flex flex-col items-center gap-1 text-outline";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleSearch(val) {
            const clearBtn = document.getElementById('clearSearchBtn');
            if (val) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            renderMenu(val);
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            renderMenu('');
        }

        function openModal(item) {
            const nameKey = `name_${currentLang.toLowerCase()}`;
            const compKey = `composition_${currentLang.toLowerCase()}`;
            
            document.getElementById('modalTitle').textContent = item[nameKey];
            document.getElementById('modalPrice').textContent = `${item.price} ₸`;
            document.getElementById('modalWeight').textContent = item.weight || '';
            
            const ingContainer = document.getElementById('modalIngredientsContainer');
            if (item[compKey]) {
                ingContainer.classList.remove('hidden');
                document.getElementById('modalIngredients').textContent = item[compKey];
            } else {
                ingContainer.classList.add('hidden');
            }

            const modal = document.getElementById('itemModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('itemModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = '';
        }

        initApp();
