<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
    <title>NECTAR | Lounge • Bar • Kitchen</title>
    
    <!-- Подключение премиальных шрифтов: Cormorant (RU), Playfair (EN) и Manrope (Текст) -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Настройки цветов (Оставляем здесь для удобства работы с Tailwind) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "forest-green": "#1b3022",
                        "warm-gold": "#a97935",
                        "cream": "#fbf9f6",
                        "nectar-accent": "#e1743d" /* Тот самый нектариновый акцент */
                    },
                    fontFamily: {
                        "serif-ru": ["Cormorant Garamond", "serif"],
                        "serif-en": ["Playfair Display", "serif"],
                        "body": ["Manrope", "sans-serif"]
                    }
                }
            }
        }
    </script>

    <!-- ПОДКЛЮЧЕНИЕ НАШЕГО ФАЙЛА СО СТИЛЯМИ -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-cream font-body text-forest-green">
    
    <!-- Шапка (Header) -->
    <header class="fixed top-0 inset-x-0 z-50 glass-effect pt-safe border-b border-forest-green/5">
        <div class="px-4 flex items-center justify-between relative h-20">
            <div class="min-w-[80px]"></div>
            <div class="absolute left-1/2 -translate-x-1/2 flex flex-col items-center">
                <h1 class="font-serif-ru text-[28px] text-forest-green tracking-tighter font-semibold">NECTAR</h1>
                <p class="text-[10px] tracking-widest uppercase mt-[-2px] text-warm-gold" data-i18n="header_subtitle">Lounge · Bar · Kitchen</p>
            </div>
            <div class="flex items-center gap-3 justify-end min-w-[80px]">
                <button aria-label="Switch to Russian" class="lang-btn lang-active" onclick="switchLang('RU')">RU</button>
                <button aria-label="Switch to Kazakh" class="lang-btn" onclick="switchLang('KZ')">KZ</button>
                <button aria-label="Switch to English" class="lang-btn" onclick="switchLang('EN')">EN</button>
            </div>
        </div>
    </header>

    <main class="flex flex-col relative w-full pb-24 pt-20">
        <!-- Секция МЕНЮ -->
        <section class="spa-section active flex-col w-full" id="menu-section">
            
            <!-- Hero Image с эффектом дыхания -->
            <div class="w-full h-64 relative -mt-4 mb-4 z-0 overflow-hidden">
                <img alt="Nectarine Hero" class="w-full h-full object-cover mix-blend-multiply opacity-90 hero-float" src="https://lh3.googleusercontent.com/aida/AEtjO1VfckORHX18V6pYkQT8N5yS9yA9sBXpVR9MhYawqAJMa6Xbm6ZQYqU9LL7UaqgjdLtKEFkd-RrEq7PZjXdhVCCwND2Z5DuMATgyoKbTQT35y373wzkqGR4vlge_G9Vgi3Nh9jCJ5JQQhc_SW4dk8AH_36BTha7h-XDx-OsSYpBDcoX0NVZDXi-oLnBW6hfKkAJZU8WPwLvjBiLKre4Z4SKjWd_2ZzhWur3FCVLKRHCF3M4LjtCnuF5h-A"/>
                <div class="absolute inset-0 bg-gradient-to-t from-cream via-cream/40 to-transparent"></div>
            </div>

            <div class="flex flex-col w-full px-4 relative z-10 -mt-12">
                <!-- Блок навигации и поиска (прилипает при скролле) -->
                <div class="sticky z-40 bg-cream/95 backdrop-blur-xl pt-2 pb-4 -mx-4 px-4 border-b border-forest-green/5 top-0">
                    
                    <!-- Поиск -->
                    <div class="search-bar flex items-center gap-3 bg-white px-5 py-3.5 rounded-2xl relative">
                        <span class="material-symbols-outlined text-forest-green/40">search</span>
                        <input id="searchInput" type="text" class="flex-1 bg-transparent border-none outline-none text-sm placeholder:text-forest-green/40" placeholder="Поиск блюд, напитков..." data-i18n-placeholder="search_placeholder"/>
                        <button id="clearSearchBtn" class="hidden absolute right-4 text-forest-green/40 hover:text-forest-green" onclick="clearSearch()">
                            <span class="material-symbols-outlined text-[20px]">close</span>
                        </button>
                    </div>

                    <!-- Табы: Кухня / Бар -->
                    <div class="flex justify-center mt-4">
                        <div class="flex items-center bg-white border border-forest-green/5 rounded-2xl p-1 shadow-sm relative w-full max-w-sm">
                            <div id="nav-indicator" class="absolute left-1 top-1 bottom-1 w-[calc(50%-4px)] bg-forest-green rounded-xl transition-transform duration-300"></div>
                            <button class="nav-btn flex-1 relative z-10 py-2.5 text-[11px] tracking-widest text-cream uppercase" data-type="kitchen" onclick="switchMainTab(0, this)" data-i18n="nav_kitchen">Кухня</button>
                            <button class="nav-btn flex-1 relative z-10 py-2.5 text-[11px] tracking-widest text-forest-green/60 uppercase" data-type="bar" onclick="switchMainTab(1, this)" data-i18n="nav_bar">Бар</button>
                        </div>
                    </div>

                    <!-- Подкатегории (Горизонтальный скролл) -->
                    <div id="categoryContainer" class="flex overflow-x-auto gap-3 pb-2 mt-4 snap-x snap-mandatory hide-scrollbar">
                        <!-- Сюда JS загрузит категории -->
                    </div>
                </div>

                <!-- Контейнер для блюд -->
                <div id="menuContainer" class="flex flex-col pb-12 mt-2">
                    <!-- Сюда JS загрузит карточки блюд -->
                </div>
            </div>
        </section>

        <!-- Секция ИНФО (Пока пустая, заполним из JS) -->
        <section class="spa-section flex-col w-full px-4 pt-8 pb-12" id="info-section">
            <div id="infoContainer"></div>
        </section>
    </main>

    <!-- Нижнее навигационное меню -->
    <nav class="fixed bottom-0 inset-x-0 z-50 pb-safe glass-effect border-t border-forest-green/10">
        <div class="flex justify-around items-center h-[72px] px-8">
            <button class="bottom-nav-btn text-forest-green" data-path="menu" onclick="switchSection('menu', this)">
                <span class="material-symbols-outlined text-[24px]">restaurant_menu</span>
                <span class="text-[10px] tracking-widest uppercase mt-1" data-i18n="tab_menu">Меню</span>
            </button>
            <button class="bottom-nav-btn text-forest-green/40" data-path="info" onclick="switchSection('info', this)">
                <span class="material-symbols-outlined text-[24px]">info</span>
                <span class="text-[10px] tracking-widest uppercase mt-1" data-i18n="tab_info">Инфо</span>
            </button>
        </div>
    </nav>

    <!-- Модальное окно блюда -->
    <div id="itemModal" class="fixed inset-0 z-[100] hidden items-center justify-center px-4">
        <div class="absolute inset-0 bg-forest-green/80 backdrop-blur-md" onclick="closeModal()"></div>
        <div class="relative bg-cream w-full max-w-md rounded-[32px] overflow-hidden flex flex-col max-h-[85vh] shadow-2xl modal-glass">
            <!-- Место под макро-фото блюда -->
            <div id="modalImageContainer" class="w-full h-48 bg-forest-green/5 hidden relative">
                <img id="modalImage" src="" class="w-full h-full object-cover" alt="Dish photo">
                <div class="absolute inset-0 bg-gradient-to-t from-cream to-transparent"></div>
            </div>
            
            <div class="p-6 flex flex-col gap-4 relative z-10">
                <div class="flex justify-between items-start gap-4">
                    <h3 id="modalTitle" class="font-serif-ru text-[26px] text-forest-green font-semibold leading-tight"></h3>
                    <button class="w-8 h-8 rounded-full bg-forest-green/5 flex items-center justify-center text-forest-green shrink-0" onclick="closeModal()">
                        <span class="material-symbols-outlined text-[20px]">close</span>
                    </button>
                </div>
                
                <div class="flex items-center gap-4 border-b border-warm-gold/20 pb-4">
                    <span id="modalPrice" class="font-serif-ru text-[28px] text-warm-gold font-medium"></span>
                    <span id="modalWeight" class="text-[12px] text-forest-green/50 border border-forest-green/10 px-2 py-1 rounded-md hidden"></span>
                </div>
                
                <div id="modalIngredientsContainer" class="flex-col gap-2 mt-2 hidden">
                    <h4 class="text-[10px] tracking-[0.2em] text-forest-green/40 uppercase" data-i18n="modal_ingredients">Ингредиенты</h4>
                    <p id="modalIngredients" class="text-[15px] text-forest-green/80 leading-relaxed font-light"></p>
                </div>
            </div>
            
            <div class="p-5 mt-auto">
                <button class="w-full py-4 bg-forest-green text-cream rounded-2xl text-[12px] tracking-widest uppercase shadow-lg shadow-forest-green/20" onclick="closeModal()" data-i18n="modal_close">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- ПОДКЛЮЧЕНИЕ НАШЕЙ ЛОГИКИ (создадим в следующем шаге) -->
    <script src="app.js"></script>
</body>
</html>
