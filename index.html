<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f4ea">
<meta name="description" content="NECTAR — Lounge · Bar · Kitchen · Алматы">
<title>NECTAR — Lounge · Bar · Kitchen</title>

<style>
*{box-sizing:border-box}

:root{
  --cream:#f8f4ea;
  --paper:#fcfaf4;
  --green:#31563f;
  --green2:#496b54;
  --orange:#c8754f;
  --peach:#e9a06e;
  --text:#303832;
  --muted:#858b83;
  --line:#dcded5;
  --gold:#b9915b;
}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:var(--cream);
  color:var(--text);
  font-family:Georgia,"Times New Roman",serif;
  -webkit-font-smoothing:antialiased;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(1100px,100%);
  margin:auto;
  padding:0 20px 50px;
}

/* HEADER */

.header{
  position:relative;
  text-align:center;
  padding:28px 0 8px;
}

.brand{
  color:var(--green);
  font-size:clamp(43px,8vw,72px);
  letter-spacing:.13em;
  line-height:1;
  margin-left:.13em;
}

.subtitle{
  margin-top:9px;
  color:var(--orange);
  font:700 9px Arial,sans-serif;
  letter-spacing:.32em;
}

.language{
  position:absolute;
  right:0;
  top:28px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.35);
  color:var(--green);
  border-radius:30px;
  padding:8px 12px;
  font:700 10px Arial,sans-serif;
}

/* HERO */

.hero{
  text-align:center;
  padding:22px 0 25px;
}

.fruit{
  width:185px;
  max-width:55vw;
  height:auto;
  display:block;
  margin:auto;
}

.hero-note{
  margin-top:4px;
  color:var(--green);
  font:700 8px Arial,sans-serif;
  letter-spacing:.27em;
}

.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:0 0 27px;
}

.divider:before,
.divider:after{
  content:"";
  height:1px;
  background:var(--gold);
  flex:1;
}

.diamond{
  width:6px;
  height:6px;
  background:var(--gold);
  transform:rotate(45deg);
}

/* MAIN NAV */

.main-nav{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  border-block:1px solid var(--line);
}

.main-nav button{
  border:0;
  background:transparent;
  min-height:72px;
  padding:10px;
  color:var(--green);
  font:700 10px Arial,sans-serif;
  letter-spacing:.08em;
  transition:.2s;
}

.main-nav button+button{
  border-left:1px solid var(--line);
}

.main-nav button:hover{
  background:#fffdf8;
}

/* CONTENT */

.content{
  padding:38px 0 20px;
}

.page-title{
  color:var(--green);
  font-size:38px;
  font-weight:400;
  margin:0 0 25px;
}

.page-subtitle{
  color:var(--muted);
  font-size:15px;
  line-height:1.7;
  max-width:700px;
  margin:-12px 0 28px;
}

.back{
  float:right;
  border:0;
  background:none;
  color:var(--green);
  font:700 10px Arial,sans-serif;
  letter-spacing:.08em;
  padding:8px 0;
}

/* SEARCH */

.search{
  width:100%;
  border:0;
  border-bottom:1px solid var(--line);
  background:transparent;
  outline:none;
  color:var(--text);
  padding:12px 3px;
  margin-bottom:25px;
  font-size:16px;
}

.search::placeholder{
  color:#a0a49d;
}

/* CATEGORY */

.categories{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.category{
  position:relative;
  text-align:left;
  min-height:82px;
  padding:21px 22px;
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--green);
  font-size:20px;
  transition:.2s;
}

.category:after{
  content:"◆";
  position:absolute;
  right:19px;
  top:50%;
  transform:translateY(-50%) scale(.45);
  color:var(--gold);
}

.category:hover{
  border-color:#c5c9bd;
  transform:translateY(-1px);
}

/* DISHES */

.dishes{
  display:grid;
  grid-template-columns:1fr 1fr;
  column-gap:55px;
}

.dish{
  border-bottom:1px solid var(--line);
  padding:16px 0;
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:flex-start;
  transition:.15s;
}

.dish:hover{
  padding-left:4px;
}

.dish-name{
  font-size:16px;
  line-height:1.42;
}

.dish-note{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
  line-height:1.45;
}

.price{
  flex-shrink:0;
  color:var(--green);
  font-size:15px;
  white-space:nowrap;
}

/* INFO */

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.info-card{
  border-top:1px solid var(--gold);
  padding:20px 4px 12px;
}

.info-card h3{
  color:var(--green);
  font-size:24px;
  font-weight:400;
  margin:0 0 10px;
}

.info-card p{
  margin:0;
  color:var(--muted);
  font-size:14px;
  line-height:1.65;
}

/* CONTACTS */

.contacts{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.contact{
  display:block;
  text-decoration:none;
  border:1px solid var(--line);
  background:var(--paper);
  padding:22px;
  color:var(--green);
}

.contact small{
  display:block;
  color:var(--orange);
  font:700 9px Arial,sans-serif;
  letter-spacing:.16em;
  margin-bottom:9px;
}

.contact strong{
  font-size:18px;
  font-weight:400;
}

/* EMPTY / FUTURE */

.future{
  border:1px dashed var(--line);
  padding:28px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
}

/* MODALS */

dialog{
  border:0;
  padding:0;
  background:transparent;
  max-width:calc(100% - 30px);
}

dialog::backdrop{
  background:rgba(36,53,43,.34);
  backdrop-filter:blur(4px);
}

.modal-box{
  width:min(520px,100%);
  background:var(--paper);
  border:1px solid var(--line);
  padding:30px;
}

.modal-close{
  float:right;
  border:0;
  background:none;
  color:var(--muted);
  font-size:26px;
  line-height:1;
}

.modal-title{
  color:var(--green);
  font-size:28px;
  font-weight:400;
  margin:0 0 7px;
  padding-right:30px;
}

.modal-price{
  color:var(--green);
  font-size:18px;
  margin-bottom:22px;
}

.meta{
  border-top:1px solid var(--line);
}

.meta-row{
  padding:14px 0;
  border-bottom:1px solid var(--line);
}

.meta-label{
  display:block;
  color:var(--orange);
  font:700 9px Arial,sans-serif;
  letter-spacing:.16em;
  margin-bottom:6px;
}

.meta-value{
  font-size:15px;
  line-height:1.6;
  color:var(--text);
}

.language-list{
  display:grid;
  gap:9px;
  margin-top:20px;
}

.language-list button{
  padding:13px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--green);
  font:700 11px Arial,sans-serif;
}

.language-list button:hover{
  background:#f4f0e5;
}

/* FOOTER */

.footer{
  text-align:center;
  padding:35px 0 10px;
  color:#a0a49d;
  font:8px Arial,sans-serif;
  letter-spacing:.2em;
}

/* MOBILE */

@media(max-width:720px){

  .app{
    padding:0 15px 35px;
  }

  .header{
    padding-top:22px;
  }

  .language{
    top:22px;
  }

  .main-nav{
    grid-template-columns:1fr 1fr;
  }

  .main-nav button:nth-child(3),
  .main-nav button:nth-child(5){
    border-left:0;
    border-top:1px solid var(--line);
  }

  .main-nav button:nth-child(4){
    border-top:1px solid var(--line);
  }

  .main-nav button:last-child{
    grid-column:1/-1;
  }

  .categories,
  .dishes,
  .info-grid,
  .contacts{
    grid-template-columns:1fr;
  }

  .page-title{
    font-size:31px;
  }

  .dish-name{
    font-size:15px;
  }

  .modal-box{
    padding:23px;
  }
}
</style>
</head>

let language=localStorage.getItem("nectar-language")||"ru";

const $=id=>document.getElementById(id);

function tr(key){
  return TEXT[language][key]||TEXT.ru[key]||key;
}

function itemName(item){
  return item[language==="ru"?0:language==="en"?1:2];
}

function itemNote(item){
  const index=language==="ru"?4:language==="en"?5:6;
  return item[index]||"";
}

function money(value){
  return Number(value).toLocaleString("ru-RU")+" ₸";
}

function updateInterface(){

  $("menuButton").textContent=tr("menu");
  $("drinksButton").textContent=tr("drinks");
  $("aboutButton").textContent=tr("about");
  $("guestButton").textContent=tr("guest");
  $("contactsButton").textContent=tr("contacts");

  $("languageButton").textContent=
    language==="kk"?"KZ":language.toUpperCase();

  $("languageTitle").textContent=tr("choose");
  $("yieldLabel").textContent=tr("yield");
  $("compositionLabel").textContent=tr("composition");

  renderHome();
}


/* HOME */

function renderHome(){

  $("content").innerHTML="";

}


/* CATEGORIES */

function showCategories(type){

  const list=MENU[type];

  $("content").innerHTML=`

    <button class="back"
            onclick="renderHome()">
      ← ${tr("back")}
    </button>

    <h1 class="page-title">
      ${type==="food"?tr("menu"):tr("drinks")}
    </h1>

    <input
      class="search"
      id="search"
      placeholder="${tr("search")}"
      autocomplete="off"
    >

    <div class="categories" id="categories">

      ${list
        .filter(section=>!section.future||section.items.length)
        .map((section,index)=>`

          <button
            class="category"
            onclick="showSection('${type}',${index})">

            ${section[language==="ru"?"ru":language==="en"?"en":"kk"]}

          </button>

        `).join("")}

    </div>
  `;

  $("search").addEventListener("input",function(){

    const q=this.value.trim().toLowerCase();

    if(!q){
      document.querySelectorAll(".category")
        .forEach(x=>x.style.display="block");
      return;
    }

    document.querySelectorAll(".category")
      .forEach((button,index)=>{

        const section=list[index];

        const names=section.items
          .map(item=>itemName(item))
          .join(" ")
          .toLowerCase();

        const title=
          section[language==="ru"?"ru":language==="en"?"en":"kk"]
          .toLowerCase();

        button.style.display=
          names.includes(q)||title.includes(q)
          ?"block":"none";
      });

  });

}


/* SECTION */

function showSection(type,index){

  const section=MENU[type][index];

  if(section.future){

    $("content").innerHTML=`

      <button class="back"
              onclick="showCategories('${type}')">
        ← ${tr("back")}
      </button>

      <h1 class="page-title">
        ${section[language==="ru"?"ru":language==="en"?"en":"kk"]}
      </h1>

      <div class="future">
        ${tr("emptyCocktails")}
      </div>
    `;

    return;
  }

  $("content").innerHTML=`

    <button class="back"
            onclick="showCategories('${type}')">
      ← ${tr("back")}
    </button>

    <h1 class="page-title">
      ${section[language==="ru"?"ru":language==="en"?"en":"kk"]}
    </h1>

    <div class="dishes">

      ${section.items.map((item,index)=>`

        <div
          class="dish"
          onclick="openDish('${type}',${index},${JSON.stringify(item).replace(/"/g,'&quot;')})">

          <div>

            <div class="dish-name">
              ${itemName(item)}
            </div>

            ${
              itemNote(item)
              ?
              `<span class="dish-note">${itemNote(item)}</span>`
              :""
            }

          </div>

          <div class="price">
            ${money(item[3])}
          </div>

        </div>

      `).join("")}

    </div>
  `;
}


/* DISH */

function openDish(type,index,itemString){

  const item=typeof itemString==="string"
    ?JSON.parse(itemString.replace(/&quot;/g,'"'))
    :itemString;

  $("dishTitle").textContent=itemName(item);

  $("dishPrice").textContent=money(item[3]);

  $("dishYield").textContent="—";

  $("dishComposition").textContent="—";

  $("dishModal").showModal();

}
